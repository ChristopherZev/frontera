name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          ANTHROPIC_API_KEY: dummy-ci-key
          UNLOCK_COOKIE_SECRET: dummy-ci-secret
          DEMO_UNLOCK_PASSWORD: dummy-ci-password
